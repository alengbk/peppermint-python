{% extends "base.html" %}
{% block topbar_actions %}
<a href="/tickets" class="btn btn-sm btn-outline" data-en="Back to Tickets" data-zh="返回工單列表">Back to Tickets</a>
{% if is_admin %}
<button class="btn btn-sm btn-outline" onclick="deleteTicket('{{ ticket_id }}')" style="color:#ef4444;margin-left:8px;" data-en="Delete" data-zh="刪除">Delete</button>
{% endif %}
{% endblock %}
{% block content %}
<div class="ticket-detail">
  <div class="ticket-main">
    <div class="ticket-header">
      <div class="ticket-number" id="ticket-number">#—</div>
      <h2 id="ticket-title"><span data-en="Loading..." data-zh="載入中...">Loading...</span></h2>
      <div class="ticket-badges" id="ticket-badges"></div>
    </div>
    <div class="ticket-body" id="ticket-detail"></div>
    <div class="ticket-body" style="padding-top:0;font-size:13px;color:var(--text-muted);" id="ticket-created"></div>

    <div class="comments-section">
      <h3 data-en="Activity" data-zh="活動記錄">Activity</h3>
      <div id="comments-list"><p class="text-muted" data-en="Loading..." data-zh="載入中...">Loading...</p></div>
      <div class="comment-form">
        <textarea id="comment-text" data-placeholder-en="Add a comment..." data-placeholder-zh="新增留言..." placeholder="Add a comment..."></textarea>
        <div class="comment-form-actions">
          <button class="btn btn-sm btn-primary" onclick="postComment('{{ ticket_id }}')" data-en="Comment" data-zh="留言">Comment</button>
          <button class="btn btn-sm btn-primary" id="btn-close-ticket" data-en="Close Issue" data-zh="結案">Close Issue</button>
        </div>
      </div>
    </div>
  </div>

  <div class="ticket-sidebar">
    <div class="sidebar-card">
      <h4 data-en="Assignee" data-zh="負責人">Assignee</h4>
      <select class="field-select" id="field-assignee" onchange="updateTicketField('{{ ticket_id }}', 'userId', this.value)">
        <option value="" data-en="Unassigned" data-zh="未指派">Unassigned</option>
        {% for u in users %}
        <option value="{{ u.id }}">{{ u.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="sidebar-card">
      <h4 data-en="Priority" data-zh="優先級">Priority</h4>
      <select class="field-select" id="field-priority" onchange="updateTicketField('{{ ticket_id }}', 'priority', this.value)">
        <option value="low" data-en="Low" data-zh="低">Low</option>
        <option value="medium" data-en="Medium" data-zh="中">Medium</option>
        <option value="high" data-en="High" data-zh="高">High</option>
      </select>
    </div>
    <div class="sidebar-card">
      <h4 data-en="Status" data-zh="狀態">Status</h4>
      <select class="field-select" id="field-status" onchange="updateTicketField('{{ ticket_id }}', 'status', this.value)">
        <option value="needs_support" data-en="Open" data-zh="待處理">Open</option>
        <option value="in_progress" data-en="In Progress" data-zh="處理中">In Progress</option>
        <option value="hold" data-en="Hold" data-zh="暫停">Hold</option>
        <option value="in_review" data-en="In Review" data-zh="審核中">In Review</option>
        <option value="done" data-en="Closed" data-zh="已結案">Closed</option>
      </select>
    </div>
    <div class="sidebar-card" id="sidebar-alert-count" style="display:none;">
      <h4 data-en="Alert Count" data-zh="告警次數">Alert Count</h4>
      <div style="font-size:28px;font-weight:700;color:var(--accent);" id="dedup-count">—</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:4px;" id="dedup-last-seen"></div>
      <div id="dedup-timeline" style="margin-top:8px;max-height:180px;overflow-y:auto;font-size:11px;color:var(--text-muted);border-top:1px solid var(--border);padding-top:6px;"></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
loadTicketDetail('{{ ticket_id }}');

async function deleteTicket(id) {
  var c = __('Delete this ticket permanently? This cannot be undone.', '永久刪除此工單？此操作無法復原。');
  if (!confirm(c)) return;
  try {
    await api(`/ticket/${id}`, { method: 'DELETE' });
    window.location.href = '/tickets';
  } catch (e) {
    alert(e.message);
  }
}
</script>
{% endblock %}
