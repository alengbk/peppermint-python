{% extends "base.html" %}
{% block topbar_actions %}
<button class="btn btn-sm btn-primary" onclick="showCreateModal()" data-en="New API Key" data-zh="新增 API 金鑰">New API Key</button>
{% endblock %}
{% block content %}
<div class="table-container">
  <table>
    <thead>
      <tr><th data-en="Name" data-zh="名稱">Name</th><th data-en="Description" data-zh="描述">Description</th><th data-en="Key Prefix" data-zh="金鑰前綴">Key Prefix</th><th data-en="Status" data-zh="狀態">Status</th><th data-en="Last Used" data-zh="最後使用">Last Used</th><th data-en="Created By" data-zh="建立者">Created By</th><th data-en="Actions" data-zh="操作">Actions</th></tr>
    </thead>
    <tbody id="sa-list">
      <tr><td colspan="7" class="empty-state"><p data-en="Loading..." data-zh="載入中...">Loading...</p></td></tr>
    </tbody>
  </table>
</div>

<!-- Create Modal -->
<div id="create-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:200;overflow-y:auto;">
  <div style="background:#fff;border-radius:8px;padding:24px;width:480px;max-width:90vw;">
    <h3 style="font-size:18px;font-weight:600;margin-bottom:16px;" data-en="New API Key" data-zh="新增 API 金鑰">New API Key</h3>
    <div class="form-group">
      <label data-en="Name" data-zh="名稱">Name</label>
      <input type="text" id="create-name" class="form-input" data-placeholder-en="e.g. jenkins-ci" data-placeholder-zh="例如 jenkins-ci" placeholder="e.g. jenkins-ci" required>
    </div>
    <div class="form-group">
      <label data-en="Description" data-zh="描述">Description</label>
      <textarea id="create-desc" class="form-input" rows="2" data-placeholder-en="Purpose of this API key" data-placeholder-zh="此 API 金鑰的用途" placeholder="Purpose of this API key"></textarea>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-outline" onclick="hideCreateModal()" data-en="Cancel" data-zh="取消">Cancel</button>
      <button class="btn btn-primary" onclick="submitCreate()" data-en="Generate" data-zh="產生">Generate</button>
    </div>
  </div>
</div>

<!-- Key Display Modal -->
<div id="key-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:200;overflow-y:auto;">
  <div style="background:#fff;border-radius:8px;padding:24px;width:560px;max-width:90vw;">
    <h3 style="font-size:18px;font-weight:600;margin-bottom:16px;" data-en="API Key Generated" data-zh="API 金鑰已產生">API Key Generated</h3>
    <div class="alert alert-info" style="margin-bottom:12px;" data-en="Copy this key now. You will not be able to see it again." data-zh="請立即複製此金鑰，關閉後將無法再次查看。">Copy this key now. You will not be able to see it again.</div>
    <div style="background:#f3f4f6;border:1px solid #d1d5db;border-radius:6px;padding:12px;font-family:monospace;font-size:13px;word-break:break-all;margin-bottom:16px;" id="key-display"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-primary" onclick="copyKey()" data-en="Copy" data-zh="複製">Copy</button>
      <button class="btn btn-outline" onclick="hideKeyModal()" data-en="Done" data-zh="完成">Done</button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let keyModalCallback = null;

function showCreateModal() { document.getElementById('create-modal').classList.remove('hidden'); }
function hideCreateModal() { document.getElementById('create-modal').classList.add('hidden'); }
function hideKeyModal() { document.getElementById('key-modal').classList.add('hidden'); }

function showKey(key) {
  document.getElementById('key-display').textContent = key;
  document.getElementById('key-modal').classList.remove('hidden');
}

function copyKey() {
  const key = document.getElementById('key-display').textContent;
  const ta = document.createElement('textarea');
  ta.value = key;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    alert(__('Copied!', '已複製！'));
  } catch (e) {
    alert(__('Press Ctrl+C to copy', '請按 Ctrl+C 複製'));
  }
  document.body.removeChild(ta);
}

async function submitCreate() {
  const name = document.getElementById('create-name').value.trim();
  if (!name) return alert(__('Name is required', '名稱為必填'));
  try {
    const data = await api('/service-account', {
      method: 'POST',
      body: JSON.stringify({ name, description: document.getElementById('create-desc').value.trim() }),
    });
    hideCreateModal();
    document.getElementById('create-name').value = '';
    document.getElementById('create-desc').value = '';
    showKey(data.api_key);
    loadServiceAccounts();
  } catch (e) {
    alert(e.message);
  }
}

async function regenerateKey(id) {
  var c = __('Regenerate API key? The old key will stop working immediately.', '重新產生 API 金鑰？舊金鑰將立即失效。');
  if (!confirm(c)) return;
  try {
    const data = await api(`/service-account/${id}/regenerate`, { method: 'POST' });
    showKey(data.api_key);
    loadServiceAccounts();
  } catch (e) {
    alert(e.message);
  }
}

async function deactivateAccount(id) {
  var c = __('Deactivate this API key? The key will stop working immediately.', '撤銷此 API 金鑰？金鑰將立即失效。');
  if (!confirm(c)) return;
  try {
    await api(`/service-account/${id}`, { method: 'DELETE' });
    loadServiceAccounts();
  } catch (e) {
    alert(e.message);
  }
}

async function deleteAccount(id) {
  var c = __('Permanently delete this service account? This cannot be undone.', '永久刪除此服務帳號？此操作無法復原。');
  if (!confirm(c)) return;
  try {
    await api(`/service-account/${id}?hard=true`, { method: 'DELETE' });
    loadServiceAccounts();
  } catch (e) {
    alert(e.message);
  }
}

async function loadServiceAccounts() {
  try {
    const data = await api('/service-account');
    const tbody = document.getElementById('sa-list');
    tbody.innerHTML = '';
    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="empty-state"><p>${__('No service accounts', '無服務帳號')}</p></td></tr>`;
      return;
    }
    data.forEach(sa => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${esc(sa.name)}</strong></td>
        <td>${esc(sa.description || '')}</td>
        <td><code>${esc(sa.key_prefix)}...</code></td>
        <td>${sa.active ? '<span class="badge badge-green">' + __('Active','啟用') + '</span>' : '<span class="badge badge-red">' + __('Inactive','停用') + '</span>'}</td>
        <td>${sa.last_used_at ? formatDate(sa.last_used_at) : '<span class="text-muted">' + __('Never','從未') + '</span>'}</td>
        <td>${esc(sa.created_by)}</td>
        <td>
          ${sa.active ? `<button class="btn btn-sm btn-outline" onclick="regenerateKey('${sa.id}')" data-en="Regenerate" data-zh="重新產生">Regenerate</button> ` : ''}
          ${sa.active ? `<button class="btn btn-sm btn-outline" onclick="deactivateAccount('${sa.id}')" style="color:#ef4444;" data-en="Revoke" data-zh="撤銷">Revoke</button>` : `<button class="btn btn-sm btn-outline" onclick="deleteAccount('${sa.id}')" style="color:#ef4444;" data-en="Delete" data-zh="刪除">Delete</button>`}
        </td>
      `;
      tbody.appendChild(tr);
    });
  } catch (e) {
    document.getElementById('sa-list').innerHTML = `<tr><td colspan="7" class="empty-state"><p>${__('Error','錯誤')}: ${e.message}</p></td></tr>`;
  }
}

loadServiceAccounts();
</script>
{% endblock %}
