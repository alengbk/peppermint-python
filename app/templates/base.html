<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peppermint-fork - {{ title }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-layout">
  <nav class="sidebar">
    <div class="sidebar-brand">
      <h1>Peppermint-fork</h1>
      <div class="version">v1.0.0</div>
    </div>
    <div class="sidebar-nav">
      <a href="/dashboard" class="{% if active == 'dashboard' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span data-en="Dashboard" data-zh="儀表板">Dashboard</span>
      </a>
      <a href="/tickets" class="{% if active == 'tickets' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
        <span data-en="Tickets" data-zh="工單">Tickets</span>
      </a>
      {% if is_admin %}
      <div class="section-title" data-en="Administration" data-zh="管理">Administration</div>
      <a href="/users" class="{% if active == 'users' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        <span data-en="Users" data-zh="使用者">Users</span>
      </a>
      <a href="/clients" class="{% if active == 'clients' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span data-en="Clients" data-zh="客戶">Clients</span>
      </a>
      <a href="/audit" class="{% if active == 'audit' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <span data-en="Audit Log" data-zh="稽核日誌">Audit Log</span>
      </a>
      <a href="/service-accounts" class="{% if active == 'service-accounts' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span data-en="API Keys" data-zh="API 金鑰">API Keys</span>
      </a>
      {% endif %}
    </div>
    <div class="sidebar-footer">
      <div class="user-name" id="sidebar-user">{{ user_name }}</div>
      <div class="sidebar-footer-actions">
        <span class="lang-switch">
          <span class="lang-btn" data-lang="en" onclick="setLang('en')">EN</span>
          <span class="lang-divider">|</span>
          <span class="lang-btn" data-lang="zh" onclick="setLang('zh')">中</span>
        </span>
        <button class="btn btn-sm btn-outline" onclick="logout(); return false;" data-en="Sign out" data-zh="登出">Sign out</button>
      </div>
    </div>
  </nav>

  <div class="main-content">
    <header class="topbar">
      <h2 class="topbar-title">{{ title }}</h2>
      <div class="topbar-actions">
        {% block topbar_actions %}{% endblock %}
      </div>
    </header>
    <div class="page-content">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
